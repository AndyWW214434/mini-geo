[project]
name = "geo"
version = "0.1.0"
description = "Mini GEO: track how AI assistants mention and recommend brands"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "temporalio>=1.9",
  "tldextract>=5.1",
  "jinja2>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt[crypto]>=2.9",
  "workos>=5.0",
  "anthropic>=0.60",
  "mcp>=1.12",
  "structlog>=24.4",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geo*"]

[tool.setuptools.package-data]
geo = ["**/*.sql", "**/*.html", "**/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
