name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: geo_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geo_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geo_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m geo.cli bootstrap   # migrate, seed, load history, pipeline, insights, report
      - run: python -m geo.cli pipeline    # second run must change nothing (idempotency smoke test)
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    env:
      WORKOS_CLIENT_ID: client_ci
      WORKOS_API_KEY: sk_test_ci
      WORKOS_COOKIE_PASSWORD: ci-cookie-password-that-is-long-enough-123
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
