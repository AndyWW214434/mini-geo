# Render Blueprint: infrastructure as code for the whole system.
# New > Blueprint > pick this repo. Values marked `sync: false` are asked for once, when the
# Blueprint is first created (Render does not allow `sync: false` inside env groups, so each
# service declares the secrets it needs). No `plan` is set: Render uses its smallest paid
# instance (0.5 CPU / 512 MB) for each service.

services:
  - type: worker
    name: geo-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m geo.workflows.worker
    numInstances: 2               # Temporal spreads workflow and activity tasks across replicas
    envVars:
      - key: DATABASE_URL         # Supabase session-pooler connection string (IPv4)
        sync: false
      - key: TEMPORAL_ADDRESS     # e.g. <namespace>.<account>.tmprl.cloud:7233
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: BRIGHTDATA_API_TOKEN # empty => synthetic source, every row labelled as such
        sync: false
      - key: COLLECTOR_SOURCE
        value: auto
      - key: FOCUS_BRAND
        value: stripe

  - type: web
    name: geo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_API_URL       # e.g. https://geo-api.onrender.com
        sync: false
      - key: CORS_ORIGINS         # JSON list, e.g. ["https://geo-web.onrender.com"]
        sync: false
      - key: FOCUS_BRAND
        value: stripe

  - type: web
    name: geo-web
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_COOKIE_PASSWORD
        generateValue: true
      - key: NEXT_PUBLIC_WORKOS_REDIRECT_URI   # https://geo-web.onrender.com/callback
        sync: false
      - key: API_URL                           # https://geo-api.onrender.com
        sync: false
      - key: NODE_VERSION
        value: "22"
